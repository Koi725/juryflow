spring:
  application:
    name: juryflow-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/juryflow}
    username: ${DB_USER:juryflow}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

juryflow:
  auth:
    token-ttl: ${TOKEN_TTL:8h}
  bootstrap:
    admin:
      username: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
      email: ${ADMIN_EMAIL:}
      full-name: ${ADMIN_FULL_NAME:}
